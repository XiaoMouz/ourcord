name: Desktop public beta

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*-beta.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: desktop-public-beta
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    environment: desktop-beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-opus mingw-w64-x86_64-opusfile mingw-w64-x86_64-pkgconf
      - uses: azure/login@v3
        if: ${{ vars.ENABLE_AZURE_SIGNING == 'true' }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install dependencies
        working-directory: ui/desktop
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Configure signed beta update channel
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY) { throw "TAURI_UPDATER_PUBLIC_KEY is required" }
          $config = @{
            plugins = @{
              updater = @{
                pubkey = $env:UPDATER_PUBLIC_KEY
                endpoints = @("https://ourcord.mou.best/downloads/latest.json")
              }
            }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content ui/desktop/src-tauri/tauri.windows.conf.json
      - name: Build native resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force ui/desktop/src-tauri/binaries | Out-Null
          Push-Location daemon
          go build -o ../ui/desktop/src-tauri/binaries/ourcord-desktop-bridge-x86_64-pc-windows-msvc.exe ./cmd/ourcord-desktop-bridge
          $mingw = @("$env:RUNNER_TEMP\msys64\mingw64", "C:\msys64\mingw64") | Where-Object { Test-Path "$_\bin\gcc.exe" } | Select-Object -First 1
          if (-not $mingw) { throw "MSYS2 MinGW64 toolchain not found" }
          $env:CGO_ENABLED = "1"
          $env:CC = "$mingw\bin\gcc.exe"
          $env:PKG_CONFIG = "$mingw\bin\pkg-config.exe"
          $env:Path = "$mingw\bin;$env:Path"
          go build -tags voice -o ../ui/desktop/src-tauri/binaries/ourcordd.exe ./cmd/ourcordd
          go build -o ../ui/desktop/src-tauri/binaries/ourcord-service.exe ./cmd/ourcord-service
          Pop-Location
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower() -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") { throw "wintun checksum mismatch" }
          Expand-Archive wintun.zip -DestinationPath wintun-dist
          Copy-Item wintun-dist/wintun/bin/amd64/wintun.dll ui/desktop/src-tauri/binaries/wintun.dll
          Copy-Item "$mingw\bin\libopus-0.dll" ui/desktop/src-tauri/binaries/libopus-0.dll
          Copy-Item "$mingw\bin\libopusfile-0.dll" ui/desktop/src-tauri/binaries/libopusfile-0.dll
          Copy-Item "$mingw\bin\libogg-0.dll" ui/desktop/src-tauri/binaries/libogg-0.dll
      - name: Sign bridge, daemon and Wintun
        if: ${{ vars.ENABLE_AZURE_SIGNING == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\ui\desktop\src-tauri\binaries
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Compile application
        working-directory: ui/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --no-bundle
      - name: Sign application executable
        if: ${{ vars.ENABLE_AZURE_SIGNING == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\ui\desktop\src-tauri\target\release\ourcord-desktop.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Bundle NSIS and updater artifacts
        working-directory: ui/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --bundles nsis
      - name: Sign installer
        if: ${{ vars.ENABLE_AZURE_SIGNING == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\ui\desktop\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Re-sign updater payload and create platform manifest
        working-directory: ui/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          pnpm tauri signer sign $installer.FullName
          $signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $manifest = @{
            version = $version
            notes = "OurCord Windows public beta"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://ourcord.mou.best/downloads/OurCord-Windows-x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content src-tauri/target/release/bundle/nsis/windows.json
      - name: Verify Authenticode signatures
        if: ${{ vars.ENABLE_AZURE_SIGNING == 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem ui/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_).Status -ne "Valid") { throw "invalid signature: $($_.FullName)" }
          }
      - name: Stage website download artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = "ui/desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$sourceDir/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          if (-not (Test-Path "$($installer.FullName).sig")) { throw "updater signature not found" }
          if (-not (Test-Path "$sourceDir/windows.json")) { throw "updater manifest not found" }

          $websiteDir = Join-Path $env:RUNNER_TEMP "website-downloads-windows"
          New-Item -ItemType Directory -Force $websiteDir | Out-Null
          $stableInstaller = Join-Path $websiteDir "OurCord-Windows-x64-setup.exe"
          Copy-Item $installer.FullName $stableInstaller
          Copy-Item "$($installer.FullName).sig" "$stableInstaller.sig"
          Copy-Item "$sourceDir/windows.json" (Join-Path $websiteDir "windows.json")
          (Get-FileHash $stableInstaller -Algorithm SHA256).Hash.ToLower() |
            Set-Content (Join-Path $websiteDir "windows.sha256")
      - name: Upload website download artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-downloads-windows
          path: ${{ runner.temp }}/website-downloads-windows/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-beta
          name: OurCord Desktop Beta
          prerelease: true
          generate_release_notes: true
          files: |
            ui/desktop/src-tauri/target/release/bundle/nsis/*.exe
            ui/desktop/src-tauri/target/release/bundle/nsis/*.zip
            ui/desktop/src-tauri/target/release/bundle/nsis/*.sig

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    environment: desktop-beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native audio dependencies
        run: brew install opus opusfile pkg-config
      - name: Install dependencies
        working-directory: ui/desktop
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Configure signed beta update channel
        working-directory: ui/desktop
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PUBLIC_KEY" || {
            echo "::error::TAURI_UPDATER_PUBLIC_KEY is required"
            exit 1
          }
          node <<'NODE'
          const fs = require("node:fs");
          const config = {
            plugins: {
              updater: {
                pubkey: process.env.UPDATER_PUBLIC_KEY,
                endpoints: ["https://ourcord.mou.best/downloads/latest.json"],
              },
            },
          };
          fs.writeFileSync("src-tauri/tauri.release.conf.json", JSON.stringify(config));
          NODE
      - name: Build native sidecars
        run: |
          set -euo pipefail
          mkdir -p ui/desktop/src-tauri/binaries
          cd daemon
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o ../ui/desktop/src-tauri/binaries/ourcord-desktop-bridge-aarch64-apple-darwin \
            ./cmd/ourcord-desktop-bridge
          CGO_ENABLED=1 go build -tags voice -trimpath -ldflags="-s -w" \
            -o ../ui/desktop/src-tauri/binaries/ourcordd-aarch64-apple-darwin \
            ./cmd/ourcordd

          binaries=../ui/desktop/src-tauri/binaries
          cp -L "$(brew --prefix opus)/lib/libopus.0.dylib" "$binaries/libopus.0.dylib"
          cp -L "$(brew --prefix opusfile)/lib/libopusfile.0.dylib" "$binaries/libopusfile.0.dylib"
          cp -L "$(brew --prefix libogg)/lib/libogg.0.dylib" "$binaries/libogg.0.dylib"
          chmod u+w "$binaries"/*.dylib

          daemon="$binaries/ourcordd-aarch64-apple-darwin"
          opus_dep="$(otool -L "$daemon" | awk '/libopus\.0\.dylib/{print $1; exit}')"
          opusfile_dep="$(otool -L "$daemon" | awk '/libopusfile\.0\.dylib/{print $1; exit}')"
          ogg_dep="$(otool -L "$binaries/libopusfile.0.dylib" | awk '/libogg\.0\.dylib/{print $1; exit}')"
          opusfile_opus_dep="$(otool -L "$binaries/libopusfile.0.dylib" | awk '/libopus\.0\.dylib/{print $1; exit}')"
          test -n "$opus_dep" -a -n "$opusfile_dep" -a -n "$ogg_dep" -a -n "$opusfile_opus_dep"

          install_name_tool \
            -change "$opus_dep" @executable_path/../Frameworks/libopus.0.dylib \
            -change "$opusfile_dep" @executable_path/../Frameworks/libopusfile.0.dylib \
            "$daemon"
          install_name_tool \
            -id @rpath/libopusfile.0.dylib \
            -change "$ogg_dep" @loader_path/libogg.0.dylib \
            -change "$opusfile_opus_dep" @loader_path/libopus.0.dylib \
            "$binaries/libopusfile.0.dylib"
          install_name_tool -id @rpath/libopus.0.dylib "$binaries/libopus.0.dylib"
          install_name_tool -id @rpath/libogg.0.dylib "$binaries/libogg.0.dylib"

          if otool -L "$daemon" "$binaries"/*.dylib | grep -E '/opt/homebrew|/Cellar'; then
            echo "::error::macOS audio binaries still reference Homebrew paths"
            exit 1
          fi
      - name: Compile application
        working-directory: ui/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.release.conf.json
      - name: Bundle app, DMG and updater artifacts
        working-directory: ui/desktop
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Verify and stage macOS artifacts
        run: |
          set -euo pipefail
          dmg="$(find ui/desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          updater="$(find ui/desktop/src-tauri/target/release/bundle/macos -name '*.app.tar.gz' -type f -print -quit)"
          app="$(find ui/desktop/src-tauri/target/release/bundle/macos -name '*.app' -type d -print -quit)"
          test -s "$dmg" || { echo "::error::DMG not found"; exit 1; }
          test -s "$updater" || { echo "::error::macOS updater archive not found"; exit 1; }
          test -s "$updater.sig" || { echo "::error::macOS updater signature not found"; exit 1; }
          test -x "$app/Contents/MacOS/ourcord-desktop-bridge" || { echo "::error::macOS bridge sidecar not bundled"; exit 1; }
          test -x "$app/Contents/MacOS/ourcordd" || { echo "::error::macOS daemon sidecar not bundled"; exit 1; }
          for library in libopus.0.dylib libopusfile.0.dylib libogg.0.dylib; do
            test -s "$app/Contents/Frameworks/$library" || {
              echo "::error::macOS audio library not bundled: $library"
              exit 1
            }
          done
          if otool -L "$app/Contents/MacOS/ourcordd" "$app/Contents/Frameworks"/*.dylib \
            | grep -E '/opt/homebrew|/Cellar'; then
            echo "::error::bundled macOS audio binaries reference Homebrew paths"
            exit 1
          fi
          hdiutil verify "$dmg"

          max_asset_bytes=$((25 * 1024 * 1024))
          test "$(wc -c < "$dmg" | tr -d ' ')" -le "$max_asset_bytes" || {
            echo "::error::DMG exceeds Cloudflare's 25 MiB static asset limit"
            exit 1
          }
          test "$(wc -c < "$updater" | tr -d ' ')" -le "$max_asset_bytes" || {
            echo "::error::macOS updater exceeds Cloudflare's 25 MiB static asset limit"
            exit 1
          }

          website_dir="$RUNNER_TEMP/website-downloads-macos"
          mkdir -p "$website_dir"
          cp "$dmg" "$website_dir/OurCord-macOS-arm64.dmg"
          cp "$updater" "$website_dir/OurCord-macOS-arm64.app.tar.gz"
          cp "$updater.sig" "$website_dir/OurCord-macOS-arm64.app.tar.gz.sig"
          shasum -a 256 "$website_dir/OurCord-macOS-arm64.dmg" | cut -d ' ' -f 1 \
            > "$website_dir/macos-dmg.sha256"
          shasum -a 256 "$website_dir/OurCord-macOS-arm64.app.tar.gz" | cut -d ' ' -f 1 \
            > "$website_dir/macos-updater.sha256"

          version="$(node -p 'require("./ui/desktop/src-tauri/tauri.conf.json").version')"
          signature="$(tr -d '\r\n' < "$updater.sig")"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg signature "$signature" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $signature,
                  url: "https://ourcord.mou.best/downloads/OurCord-macOS-arm64.app.tar.gz"
                }
              }
            }' > "$website_dir/macos.json"
      - name: Upload website download artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-downloads-macos
          path: ${{ runner.temp }}/website-downloads-macos/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-beta
          name: OurCord Desktop Beta
          prerelease: true
          generate_release_notes: true
          files: |
            ui/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            ui/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            ui/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  publish-website:
    name: Publish installer to website
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-beta
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: Require Cloudflare deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"
            exit 1
          }
      - name: Download Windows website artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-downloads-windows
          path: ui/web/public/downloads
      - name: Download macOS website artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-downloads-macos
          path: ui/web/public/downloads
      - name: Verify website artifacts
        run: |
          set -euo pipefail
          verify_sha() {
            local file="$1"
            local checksum_file="$2"
            local expected actual
            expected="$(tr -d '\r\n' < "$checksum_file")"
            actual="$(sha256sum "$file" | cut -d ' ' -f 1)"
            test "$actual" = "$expected" || {
              echo "::error::build artifact checksum mismatch: $file"
              exit 1
            }
          }

          verify_sha public/downloads/OurCord-Windows-x64-setup.exe public/downloads/windows.sha256
          verify_sha public/downloads/OurCord-macOS-arm64.dmg public/downloads/macos-dmg.sha256
          verify_sha public/downloads/OurCord-macOS-arm64.app.tar.gz public/downloads/macos-updater.sha256

          jq -s '
            if .[0].version != .[1].version then
              error("platform versions do not match")
            else {
              version: .[0].version,
              notes: "OurCord desktop public beta",
              pub_date: ([.[].pub_date] | max),
              platforms: (map(.platforms) | add)
            } end
          ' public/downloads/windows.json public/downloads/macos.json \
            > public/downloads/latest.json
          jq -e '
            .platforms["windows-x86_64"].url ==
              "https://ourcord.mou.best/downloads/OurCord-Windows-x64-setup.exe" and
            .platforms["darwin-aarch64"].url ==
              "https://ourcord.mou.best/downloads/OurCord-macOS-arm64.app.tar.gz" and
            (.platforms["windows-x86_64"].signature | length > 0) and
            (.platforms["darwin-aarch64"].signature | length > 0)
          ' public/downloads/latest.json >/dev/null
          rm public/downloads/windows.sha256 \
             public/downloads/macos-dmg.sha256 \
             public/downloads/macos-updater.sha256 \
             public/downloads/windows.json \
             public/downloads/macos.json
      - name: Build and test website
        run: |
          npm ci
          npm test
      - name: Deploy website and installer
        run: npx wrangler deploy --config wrangler.apex.jsonc
      - name: Verify public download
        run: |
          set -euo pipefail
          downloaded="$(mktemp)"
          trap 'rm -f "$downloaded"' EXIT

          verify_public() {
            local file="$1"
            local url="$2"
            local expected actual
            expected="$(sha256sum "$file" | cut -d ' ' -f 1)"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location \
                --output "$downloaded" "$url"; then
                actual="$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
                if [[ "$actual" == "$expected" ]]; then
                  return 0
                fi
              fi
              sleep 10
            done
            echo "::error::installer checksum mismatch after deployment: $url"
            exit 1
          }

          verify_public \
            public/downloads/OurCord-Windows-x64-setup.exe \
            https://ourcord.mou.best/downloads/OurCord-Windows-x64-setup.exe
          verify_public \
            public/downloads/OurCord-macOS-arm64.dmg \
            https://ourcord.mou.best/downloads/OurCord-macOS-arm64.dmg
          verify_public \
            public/downloads/OurCord-macOS-arm64.app.tar.gz \
            https://ourcord.mou.best/downloads/OurCord-macOS-arm64.app.tar.gz

          verify_metadata() {
            local manifest homepage
            for attempt in $(seq 1 12); do
              if manifest="$(curl --fail --silent --show-error \
                   https://ourcord.mou.best/downloads/latest.json)" &&
                 jq -e \
                   '.platforms["windows-x86_64"].url ==
                      "https://ourcord.mou.best/downloads/OurCord-Windows-x64-setup.exe" and
                    .platforms["darwin-aarch64"].url ==
                      "https://ourcord.mou.best/downloads/OurCord-macOS-arm64.app.tar.gz"' \
                   <<<"$manifest" >/dev/null &&
                 homepage="$(curl --fail --silent --show-error https://ourcord.mou.best/)" &&
                 grep --fixed-strings "/downloads/OurCord-Windows-x64-setup.exe" \
                   <<<"$homepage" >/dev/null &&
                 grep --fixed-strings "/downloads/OurCord-macOS-arm64.dmg" \
                   <<<"$homepage" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            echo "::error::website metadata did not propagate after deployment"
            exit 1
          }

          verify_metadata
      - name: Publish combined updater manifest to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-beta public/downloads/latest.json \
            --repo "${{ github.repository }}" \
            --clobber
