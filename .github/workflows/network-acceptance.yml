name: Network release acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: direct + DERP + A-B-C + recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux network tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iputils-ping
          sudo -n true
          test -c /dev/net/tun
      - name: Install Worker dependencies for Linux
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          (cd control && pnpm install --frozen-lockfile)
          (cd service && pnpm install --frozen-lockfile)
      - name: Run network acceptance smoke
        env:
          KEEP_SMOKE: "1"
        run: bash tests/e2e/smoke_abc_netns.sh
      - name: Upload smoke logs and local state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-acceptance-${{ github.run_id }}
          path: .smoke-tmp/abc-netns
          if-no-files-found: warn
          retention-days: 14
