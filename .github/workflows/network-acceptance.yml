name: Network release acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netns:
    name: direct + DERP + A-B-C + voice + recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: |
            daemon/go.sum
            relay/go.sum
            filebackend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Linux network tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iputils-ping
          sudo -n true
          test -c /dev/net/tun
      - name: Install Worker dependencies for Linux
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          (cd control && pnpm install --frozen-lockfile)
          (cd service && pnpm install --frozen-lockfile)
      - name: Run network acceptance smoke
        env:
          KEEP_SMOKE: "1"
          NODE22_BIN: node
        run: bash tests/e2e/smoke_abc_netns.sh
      - name: Upload smoke logs and local state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: network-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .smoke-tmp/abc-netns
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
