name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web landing page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm test

  workers:
    name: Workers (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [control, service]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  go:
    name: Go (build + vet + race tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [daemon, relay, filebackend]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.mod }}/go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  voice-build:
    name: Voice build (cgo Opus + audio devices)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: true
      # The `voice` build tag pulls in cgo libopus (hraban/opus) and the audio
      # device layer (malgo). Linux needs the Opus + ALSA dev packages; macOS
      # uses CoreAudio and Homebrew's opus/opusfile. The default (tag-less)
      # build stays CGO=0 and is covered by the `go` job above.
      - name: Install Opus + audio dev libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libopus-dev libopusfile-dev libasound2-dev
      - name: Install Opus (macOS)
        if: runner.os == 'macOS'
        run: brew install opus opusfile pkg-config
      - name: Build and test with the voice tag
        env:
          CGO_ENABLED: "1"
        run: |
          go build -tags voice ./...
          go test -tags voice ./pkg/media/

  proto:
    name: Proto contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.71.0
      - working-directory: proto
        run: |
          buf lint
          buf format --diff
          buf generate
      # Go bindings are generated into the daemon module and committed (the
      # daemon imports them for the gRPC IPC transport). Regeneration above
      # must be a no-op, or the schema and the committed bindings have drifted.
      - name: Verify committed Go bindings match the schema
        run: git diff --exit-code -- daemon/pkg/pb

  cross-compile:
    name: Cross-compile daemon
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: true
      - name: build daemon for ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  windows-native:
    name: Windows (Wintun native tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: true
      # Compile + run the windows-tagged tun code natively. This catches
      # windows-only breakage the ubuntu jobs can't, and does NOT need
      # wintun.dll: the driver is loaded lazily only when an adapter is created,
      # and the adapter smoke below is env-gated (skipped here).
      - run: go build ./...
      - run: go vet ./pkg/tun/...
      - run: go test ./pkg/tun/... ./cmd/ourcordd/...
      - name: ICE gathering with local STUN servers
        run: go test ./pkg/ice/...
      # Real Wintun adapter smoke: driver load + address assign + /32 route
      # round-trip. Needs wintun.dll on the DLL search path; the runner account
      # is a local admin so adapter creation and the System32 copy succeed.
      - name: Install pinned Wintun driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $expected = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          $actual = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "wintun.zip sha256 mismatch: got $actual want $expected" }
          Expand-Archive wintun.zip -DestinationPath wintun-dist -Force
          Copy-Item wintun-dist/wintun/bin/amd64/wintun.dll -Destination "$env:WINDIR/System32/wintun.dll" -Force
      - name: Wintun adapter smoke
        env:
          OURCORD_WINTUN_SMOKE: "1"
        run: go test -run TestWintunAdapterSmoke -v ./pkg/tun/

  desktop-web:
    name: Desktop (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop-native:
    name: Desktop (Windows native shell)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-opus mingw-w64-x86_64-opusfile mingw-w64-x86_64-pkgconf
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build Windows bridge and daemon resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Push-Location ../../daemon
          go build -o ../ui/desktop/src-tauri/binaries/ourcord-desktop-bridge-x86_64-pc-windows-msvc.exe ./cmd/ourcord-desktop-bridge
          $mingw = @("$env:RUNNER_TEMP\msys64\mingw64", "C:\msys64\mingw64") | Where-Object { Test-Path "$_\bin\gcc.exe" } | Select-Object -First 1
          if (-not $mingw) { throw "MSYS2 MinGW64 toolchain not found" }
          $env:CGO_ENABLED = "1"
          $env:CC = "$mingw\bin\gcc.exe"
          $env:PKG_CONFIG = "$mingw\bin\pkg-config.exe"
          $env:Path = "$mingw\bin;$env:Path"
          go build -tags voice -o ../ui/desktop/src-tauri/binaries/ourcordd.exe ./cmd/ourcordd
          go build -o ../ui/desktop/src-tauri/binaries/ourcord-service.exe ./cmd/ourcord-service
          Pop-Location
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower() -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") { throw "wintun checksum mismatch" }
          Expand-Archive wintun.zip -DestinationPath wintun-dist
          Copy-Item wintun-dist/wintun/bin/amd64/wintun.dll src-tauri/binaries/wintun.dll
          Copy-Item "$mingw\bin\libopus-0.dll" src-tauri/binaries/libopus-0.dll
          Copy-Item "$mingw\bin\libopusfile-0.dll" src-tauri/binaries/libopusfile-0.dll
          Copy-Item "$mingw\bin\libogg-0.dll" src-tauri/binaries/libogg-0.dll
      - name: Compile Tauri application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_TEST_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_TEST_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --no-bundle
