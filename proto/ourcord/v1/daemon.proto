syntax = "proto3";

package ourcord.v1;

// Go bindings are generated INTO the daemon module (and committed) because the
// daemon and its clients now import them for the gRPC transport; CI regenerates
// and diffs to keep them in sync with this schema.
option go_package = "github.com/ourcord/ourcord/daemon/pkg/pb/ourcordv1;ourcordv1";

// DaemonService is the stable local UI-to-daemon contract.
//
// It describes operations, messages, and field numbers. The daemon serves this
// API as gRPC over an authenticated local Unix socket; see proto/README.md for
// the transport and compatibility rules.
service DaemonService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc EnterNetwork(EnterNetworkRequest) returns (EnterNetworkResponse);
  rpc LeaveNetwork(LeaveNetworkRequest) returns (LeaveNetworkResponse);
  rpc GetLocalProfile(GetLocalProfileRequest) returns (GetLocalProfileResponse);
  rpc EnrollDevice(EnrollDeviceRequest) returns (EnrollDeviceResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  DaemonStatus status = 1;
}

message ListPeersRequest {}

message ConnectRequest {}

message ConnectResponse {
  OperationResult result = 1;
}

message DisconnectRequest {}

message DisconnectResponse {
  OperationResult result = 1;
}

message LeaveNetworkRequest {}

message LeaveNetworkResponse {
  OperationResult result = 1;
}

message GetLocalProfileRequest {}

message LocalProfile {
  string public_key = 1;
  bool enrolled = 2;
  string device_id = 3;
  string device_name = 4;
  string user_id = 5;
}

message GetLocalProfileResponse {
  LocalProfile profile = 1;
}

message EnrollDeviceRequest {
  // Short-lived user JWT. It is consumed locally and must never be logged or
  // returned; the daemon persists only the resulting device credential.
  string access_token = 1;
  string user_id = 2;
  string device_name = 3;
}

message EnrollDeviceResponse {
  OperationResult result = 1;
  LocalProfile profile = 2;
}

// OperationResult is used for state-changing requests. Transport-level errors
// (unauthenticated, unavailable, invalid request) belong to the RPC status;
// an operation-specific failure is represented by ok=false and error_code.
message OperationResult {
  bool ok = 1;
  string error_code = 2;
  string error_message = 3;
}

message EnterNetworkRequest {
  // vpn_namespace for a room, or a canonical pair:<keyA>.<keyB> identifier.
  // Room business IDs are not accepted by this stable method.
  string network_id = 1;
}

message EnterNetworkResponse {
  OperationResult result = 1;
}

message DaemonStatus {
  bool running = 1;
  bool vpn_active = 2;
  string ipv4 = 3;
  string ipv6 = 4;
  string network_id = 5;
  uint32 peer_count = 6;
  bool relay_used = 7;
  string relay_url = 8;
  Path path_summary = 9;
  TransportStats transport = 10;
  // Sum of per-peer path-label transitions observed during this connection.
  // A rising value indicates an unstable overlay; see ConnectedPeer.flapping.
  uint64 path_flaps_total = 11;
}

message ListPeersResponse {
  repeated ConnectedPeer peers = 1;
}

message ConnectedPeer {
  string public_key = 1;
  string name = 2;
  string ipv4 = 3;
  string ipv6 = 4;
  bool direct = 5;
  Path path = 6;
  string endpoint = 7;
  string candidate_endpoint = 8;
  string relay_url = 9;
  string next_hop_public_key = 10;
  double latency_ms = 11;
  int64 last_seen_seconds = 12;
  string last_error = 13;
  // Number of times this peer's effective path label changed this connection.
  uint64 path_transitions = 14;
  // Seconds the peer has held its current path label (dwell time).
  int64 path_dwell_seconds = 15;
  // True when the peer's path is churning (>= threshold transitions in window).
  bool flapping = 16;
  // Stable account identity and safe public nickname. `name` remains the
  // device name so clients can render "nickname · device" without guessing.
  string user_id = 17;
  string display_name = 18;
}

// PATH_UNSPECIFIED is mandatory for absent or unrecognised values. Clients
// must handle enum values they do not know, so new paths can be added safely.
enum Path {
  PATH_UNSPECIFIED = 0;
  PATH_INACTIVE = 1;
  PATH_NO_PEERS = 2;
  PATH_WAITING = 3;
  PATH_DIRECT = 4;
  PATH_DERP = 5;
  PATH_NEXT_HOP = 6;
  PATH_DEGRADED = 7;
  PATH_UNRESOLVED = 8;
}

message TransportStats {
  uint32 mtu = 1;
  uint64 ice_sent_packets = 2;
  uint64 ice_recv_packets = 3;
  uint64 ice_recv_drops = 4;
  uint64 ice_send_errors = 5;
  uint64 ice_recv_errors = 6;
  uint64 ice_probe_sent = 7;
  uint64 ice_probe_ack_sent = 8;
  uint64 ice_probe_ack_received = 9;
  uint64 ice_probe_timeouts = 10;
  uint64 ice_probe_invalid = 11;
  uint64 ice_max_packet_bytes = 12;
  uint64 derp_sent_packets = 13;
  uint64 derp_recv_packets = 14;
  uint64 derp_recv_drops = 15;
  uint64 derp_suppressed_packets = 16;
  uint64 derp_send_errors = 17;
  uint64 derp_recv_errors = 18;
  uint64 derp_max_packet_bytes = 19;
}
