name = "ourcord-service"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "service.ourcord.mou.best", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "ourcord-service"
database_id = "23a652af-b18c-4ce3-b2aa-a1cbb980d1ff"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "348d924ec4054f9ea5a7b006350558e6"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ourcord-files"

[vars]
ENVIRONMENT = "production"
R2_MAX_BYTES = "10737418240" # 10 GiB across all lobbies, including pending deletion
R2_MAX_FILES = "1000"
R2_MAX_FILE_BYTES = "104857600" # 100 MiB; lobby policies may only tighten this

# Hourly R2 cleanup of expired file records (see scheduled handler in src/index.ts).
[triggers]
crons = ["0 * * * *"]

[[ratelimits]]
name = "RATE_LIMIT_5"
namespace_id = "12005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_10"
namespace_id = "12010"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_20"
namespace_id = "12020"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_30"
namespace_id = "12030"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_60"
namespace_id = "12060"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_120"
namespace_id = "12120"
simple = { limit = 120, period = 60 }
